# Wolf on Proxmox, backed by LXC2Docker (docker-lxc-daemon).
#
# This is the Proxmox equivalent of the SmoothNAS Wolf plugin: Wolf runs as a
# container against the host docker-lxc-daemon socket, and every session it
# launches becomes a sibling Proxmox CT (gow.pve=true) instead of a Docker
# container. Bring it up against the host daemon:
#
#   docker compose up -d                                   # Intel / AMD
#   docker compose -f docker-compose.yml -f docker-compose.nvidia.yml up -d   # NVIDIA
#
# Prereqs (see README.md): docker-lxc-daemon installed on the PVE host, the host
# GPU drivers loaded, and the Wolf virtual-input udev rules installed.
#
# Both services run the upstream Games-on-Whales images unmodified, from the
# release channel in WOLF_CHANNEL (stable or beta). This recipe adds only files
# mounted into them: the config bootstrap and the default profile set.

services:
  wolf:
    image: ${WOLF_IMAGE:-ghcr.io/games-on-whales/wolf:${WOLF_CHANNEL:-stable}}
    container_name: wolf
    restart: unless-stopped

    # Proxmox CT mode: Wolf and every session it spawns become first-class
    # Proxmox CTs on ${DLD_STORAGE}. A static LAN IP keeps Moonlight/mDNS
    # discovery working (matches the production deploy).
    labels:
      gow.pve: "true"
      # Proxmox CT id for Wolf itself (requires docker-lxc-daemon >= 0.1.3).
      # Empty lets the daemon select a free cluster-wide id, as it does for
      # session and template CTs. This label does not reserve a session range.
      dld.vmid: "${WOLF_CTID:-}"
      gow.lan: "true"
      gow.lan.ip: "${WOLF_LAN_IP}"
      dld.storage: "${DLD_STORAGE:-local-lvm}"
      # Wolf CT rootfs size — big enough for the Steam library / game data that
      # persists on the container. Games live on the daemon storage (DLD_STORAGE),
      # not the OS root.
      dld.disksize: "${WOLF_DISK_SIZE:-100G}"

    # CT cores/RAM. The daemon maps Docker's cpus/mem_limit onto the CT; 0 means
    # uncapped (all host cores / all host RAM), which is the daemon's default.
    cpus: ${WOLF_CPUS:-0}
    mem_limit: ${WOLF_MEMORY:-0}

    environment:
      # Wolf state + the socket it drives (the host LXC2Docker socket).
      HOST_APPS_STATE_FOLDER: /etc/wolf
      WOLF_DOCKER_SOCKET: /var/run/docker.sock
      # Identity-mapped runtime dir: sockets Wolf bind-mounts into sibling
      # session CTs must resolve at the same path on the host.
      XDG_RUNTIME_DIR: ${WOLF_RUNTIME_DIR:-/run/wolf}
      WOLF_RENDER_NODE: ${WOLF_RENDER_NODE:-/dev/dri/renderD128}
      WOLF_ENCODER_NODE: ${WOLF_ENCODER_NODE:-}
      # Tag for the GOW app images seeded into config.toml (firefox, steam, ...).
      WOLF_IMAGE_TAG: ${WOLF_IMAGE_TAG:-edge}
      # Keyboard layout, locale and timezone added to every app's env (same
      # script). Empty leaves the apps' own default.
      WOLF_KEYBOARD: ${WOLF_KEYBOARD:-}
      WOLF_KEYBOARD_VARIANT: ${WOLF_KEYBOARD_VARIANT:-}
      WOLF_LOCALE: ${WOLF_LOCALE:-}
      WOLF_TZ: ${WOLF_TZ:-}
      # Proton's per-game log, off unless set (same script).
      WOLF_PROTON_LOG: ${WOLF_PROTON_LOG:-}
      # Only used if Wolf falls back to a PulseAudio sidecar; the upstream image
      # normally runs PulseAudio itself.
      WOLF_PULSE_IMAGE: ghcr.io/games-on-whales/pulseaudio:${WOLF_IMAGE_TAG:-edge}
      WOLF_LOG_LEVEL: ${WOLF_LOG_LEVEL:-INFO}
      WOLF_STOP_CONTAINER_ON_EXIT: "${WOLF_STOP_CONTAINER_ON_EXIT:-TRUE}"

    volumes:
      # Seeds config.toml on first start and pins the app image tags and
      # keyboard/locale/timezone on every start (wolf-config-init.sh); the
      # upstream entrypoint sources it.
      - ./wolf-config-init.sh:/etc/cont-init.d/40-wolf-proxmox.sh:ro
      - ./config/default-config.toml:/opt/wolf-proxmox/default-config.toml:ro
      - /etc/wolf:/etc/wolf
      - /var/run/docker.sock:/var/run/docker.sock
      - /run/udev:/run/udev:ro
      - ${WOLF_RUNTIME_DIR:-/run/wolf}:${WOLF_RUNTIME_DIR:-/run/wolf}
      # Wolf (the control plane) needs the host's real /dev/input devtmpfs so it
      # can stat the virtual pads it creates and report their true major:minor to
      # sibling session containers — otherwise controllers arrive as 0:0 and
      # don't work. An explicit bind here also tells docker-lxc-daemon NOT to
      # shadow /dev/input with a private tmpfs (that isolation is for sessions,
      # which don't bind it).
      - /dev/input:/dev/input

    devices:
      - /dev/dri
      - /dev/uinput
      - /dev/uhid

    # Virtual input (uinput 10:223, uhid 10:239, /dev/input 13:*) + hidraw 244.
    device_cgroup_rules:
      - "c 10:223 rwm"
      - "c 10:239 rwm"
      - "c 13:* rmw"
      - "c 244:* rmw"

    # Capabilities Wolf needs for virtual input and to manage session CTs.
    cap_add:
      - NET_RAW
      - MKNOD
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_NICE

  # Wolf Den (WolfLeash), the web UI for managing Wolf, as its own small CT. It
  # talks to Wolf over the API socket Wolf creates at ${XDG_RUNTIME_DIR}/wolf.sock,
  # which both CTs see at the same host path. The daemon publishes the UI on the
  # Proxmox host itself: http://<pve-host>:${WOLF_DEN_PORT}.
  wolf-den:
    image: ${WOLF_DEN_IMAGE:-ghcr.io/games-on-whales/wolf-den:${WOLF_CHANNEL:-stable}}
    container_name: wolf-den
    restart: unless-stopped
    depends_on:
      - wolf

    labels:
      gow.pve: "true"
      dld.storage: "${DLD_STORAGE:-local-lvm}"
      dld.disksize: "${WOLF_DEN_DISK_SIZE:-8G}"

    environment:
      WOLF_SOCKET_PATH: ${WOLF_RUNTIME_DIR:-/run/wolf}/wolf.sock
      # The image gives up after 30s without a socket. Wolf's first start in a
      # fresh CT can take longer than that.
      WOLF_SOCKET_TIMEOUT: "600"

    volumes:
      - ${WOLF_RUNTIME_DIR:-/run/wolf}:${WOLF_RUNTIME_DIR:-/run/wolf}
      # Compatibility tools Wolf Den installs for Steam (appsettings.json).
      - /etc/wolf:/etc/wolf

    ports:
      - "${WOLF_DEN_PORT:-8080}:8080"
