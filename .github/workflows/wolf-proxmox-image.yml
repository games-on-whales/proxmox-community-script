name: Wolf Proxmox image

# Builds and publishes the Proxmox Wolf image (upstream Wolf + Wolf Den UI) from
# the repository root. The image only adds a thin layer on top of the upstream
# images, so it goes stale whenever they move: a daily check rebuilds it when
# wolf:stable or wolf-den:stable has a new digest, and a push to main rebuilds it
# when the image's own files change. Pull requests touching those files get a
# build without a push.

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - startup-app.sh
      - wolf-den-launch.sh
      - wolf-den-entrypoint.sh
      - config/**
      - .github/workflows/wolf-proxmox-image.yml
  pull_request:
    paths:
      - Dockerfile
      - startup-app.sh
      - wolf-den-launch.sh
      - wolf-den-entrypoint.sh
      - config/**
      - .github/workflows/wolf-proxmox-image.yml
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (e.g. latest, 2026.07)"
        required: true
        default: latest
      wolf_base:
        description: "Upstream Wolf base image"
        required: true
        default: ghcr.io/games-on-whales/wolf:stable

permissions:
  contents: read
  packages: write

concurrency:
  group: wolf-proxmox-image-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/wolf-proxmox
  WOLF_BASE: ${{ inputs.wolf_base || 'ghcr.io/games-on-whales/wolf:stable' }}
  WOLF_DEN_IMAGE: ghcr.io/games-on-whales/wolf-den:stable
  TAG: ${{ inputs.tag || 'latest' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pin both upstream images by digest for this build, and compare them with
      # the digests recorded on the published image to decide whether a
      # scheduled run has anything to do.
      - name: Resolve upstream images
        id: upstream
        run: |
          set -euo pipefail
          digest() { skopeo inspect --format '{{.Digest}}' "docker://$1"; }
          wolf=$(digest "$WOLF_BASE")
          den=$(digest "$WOLF_DEN_IMAGE")
          echo "wolf=$wolf" >> "$GITHUB_OUTPUT"
          echo "den=$den" >> "$GITHUB_OUTPUT"
          build=true
          if [ "${{ github.event_name }}" = schedule ]; then
            labels=$(skopeo inspect --format '{{json .Labels}}' "docker://$IMAGE:$TAG" 2>/dev/null || echo '{}')
            had_wolf=$(jq -r '."io.games-on-whales.wolf.digest" // ""' <<<"$labels")
            had_den=$(jq -r '."io.games-on-whales.wolf-den.digest" // ""' <<<"$labels")
            if [ "$had_wolf" = "$wolf" ] && [ "$had_den" = "$den" ]; then
              build=false
              echo "$IMAGE:$TAG already built from wolf $wolf and wolf-den $den" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - if: steps.upstream.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - if: steps.upstream.outputs.build == 'true' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.upstream.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            WOLF_BASE=${{ env.WOLF_BASE }}@${{ steps.upstream.outputs.wolf }}
            WOLF_DEN_IMAGE=${{ env.WOLF_DEN_IMAGE }}@${{ steps.upstream.outputs.den }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            io.games-on-whales.wolf.image=${{ env.WOLF_BASE }}
            io.games-on-whales.wolf.digest=${{ steps.upstream.outputs.wolf }}
            io.games-on-whales.wolf-den.digest=${{ steps.upstream.outputs.den }}
          tags: ${{ env.IMAGE }}:${{ env.TAG }}

      - name: Summary
        if: steps.upstream.outputs.build == 'true'
        run: |
          {
            echo "${{ github.event_name == 'pull_request' && 'Built (not pushed)' || 'Published' }} \`$IMAGE:$TAG\`"
            echo
            echo "- wolf: \`$WOLF_BASE@${{ steps.upstream.outputs.wolf }}\`"
            echo "- wolf-den: \`$WOLF_DEN_IMAGE@${{ steps.upstream.outputs.den }}\`"
            echo "- revision: \`${{ github.sha }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
